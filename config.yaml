# MLOps Project Configuration
# This file will eventually control paths, hyperparameters, and toggles.

paths:
  raw: "data/raw/insurance.csv"
  processed: "data/processed/clean.csv"
  model: "models/linreg_insurance.joblib"
  inference: "data/inference/insurance_inference.csv"
  predictions: "reports/predictions.csv"
  reports_dir: "reports"

train:
  test_size: 0.2
  seed: 42

schema:
  required_columns:
    - age
    - sex
    - bmi
    - children
    - smoker
    - region
    - charges
  target: "log_charges"
  domain:
    non_negative:
      - age
      - children
      - charges
    positive:
      - bmi
    allowed_values:
      sex: ["male", "female"]
      smoker: ["yes", "no"]

features:
  numerical:
    - age
    - bmi
    - children
  categorical:
    - sex
    - smoker
    - region

logging:
  level: "INFO"
  file: "reports/pipeline.log"